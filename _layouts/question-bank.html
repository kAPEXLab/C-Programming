<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <base target="question-content">
</head>
<body class="home">
  <div class="page-grid">
    <header class="brand">
      <img src="{{ '/assets/img/LOGO-APEX-Lab-KPIT-Jun25.png' | relative_url }}" alt="KPIT APEX Lab">
    </header>
    <header class="page-title">
      <h1>C Programming Question Bank</h1>
    </header>
    <nav class="question-index" aria-label="Question index">
      {{ content | replace: '.md"', '.html"' }}
    </nav>
    <main class="question-panel">
      <iframe
        name="question-content"
        title="Selected question"
        src="{{ '/Question-Bank/01_Variables/01_motor_input_power_variables.html' | relative_url }}">
      </iframe>
    </main>
  </div>
</body>
</html>
