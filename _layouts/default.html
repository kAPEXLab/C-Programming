<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | escape }} | {{ site.title | default: "KPIT APEX Lab" }}</title>

  <!-- Minimal site styles to control layout. Theme CSS (from your Jekyll theme)
       will still load automatically via GitHub Pages. -->
  <style>
    :root{
      --sidebar-w: 20vw;        /* ~20% viewport width for index pane */
      --max-page-w: 1200px;     /* cap overall width (optional) */
      --gap: 24px;
      --border: #e5e7eb;
      --link: #0366d6;
      --bg-code: #f6f8fa;
    }

    /* Reset & base */
    * { box-sizing: border-box; }
    body { margin: 0; }

    /* Page grid: header (auto) + main (1fr) */
    .container{
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* Header */
    header.site-header{
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header.site-header h1{
      font-size: 1.25rem;
      margin: 0;
      letter-spacing: .2px;
      font-weight: 700;
    }
    header.site-header nav a{
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
      margin-left: 8px;
    }
    header.site-header nav a:hover{
      text-decoration: underline;
    }

    /* Main 20/80 split */
    .main{
      display: grid;
      grid-template-columns: minmax(220px, var(--sidebar-w)) 1fr; /* 20% / 80% */
      column-gap: var(--gap);
      max-width: var(--max-page-w);
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    /* Sidebar (index) */
    aside.qb-index{
      border-right: 1px solid var(--border);
      padding-right: 16px;
      position: sticky;
      top: 0;                     /* stays visible while scrolling */
      align-self: start;
      max-height: calc(100vh - 70px);
      overflow: auto;
    }
    aside.qb-index h1,
    aside.qb-index h2,
    aside.qb-index h3{ margin-top: 0.6rem; }

    /* Content (question body) */
    main.content{ min-width: 0; }
    main.content pre{
      overflow: auto;
      background: var(--bg-code);
      padding: 12px;
      border-radius: 6px;
    }
    main.content table{
      width: 100%;
      border-collapse: collapse;
    }
    main.content th, main.content td{
      border: 1px solid var(--border);
      padding: 6px 8px;
      vertical-align: top;
    }

    /* Hide index when requested by page front matter */
    .no-index .main{
      grid-template-columns: 1fr;   /* single column */
    }
    .no-index aside.qb-index{
      display: none;
