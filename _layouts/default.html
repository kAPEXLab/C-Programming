<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | escape }} | {{ site.title | default: "KPIT APEX Lab" }}</title>

  <style>
    :root{
      --sidebar-w: 20vw;
      --content-w: 80vw;
      --max-page-w: 1200px;
    }
    body{ margin:0; }
    .container{
      display:grid;
      grid-template-rows:auto 1fr;
      min-height:100vh;
    }
    header.site-header{
      border-bottom:1px solid #e5e7eb;
      padding:16px 20px;
      display:flex;
      align-items:center;
      gap:16px;
    }
    header.site-header h1{
      font-size:1.4rem;
      margin:0;
      letter-spacing:.2px;
    }
    header.site-header nav a{
      color:#0366d6;
      text-decoration:none;
      font-weight:600;
      margin-left:8px;
    }
    .main{
      display:grid;
      grid-template-columns: minmax(220px, var(--sidebar-w)) 1fr; /* 20% / 80% */
      column-gap:24px;
      max-width:var(--max-page-w);
      margin:0 auto;
      padding:20px;
      width:100%;
      box-sizing:border-box;
    }
    aside.qb-index{
      border-right:1px solid #e5e7eb;
      padding-right:16px;
      position:sticky;
      top:0;
      align-self:start;
      max-height:calc(100vh - 70px);
      overflow:auto;
    }
    .content{ min-width:0; }
    .no-index .main{ grid-template-columns: 1fr; }
    .no-index aside.qb-index{ display:none; }
    .content pre{ overflow:auto; background:#f6f8fa; padding:12px; border-radius:6px; }
    .content table{ width:100%; border-collapse:collapse; }
    .content th, .content td{ border:1px solid #e5e7eb; padding:6px 8px; }
  </style>
</head>
<body class="{% if page.hide_index %}no-index{% endif %}">
  <div class="container">
    <header class="site-header">
      <h1>KPIT APEX Lab</h1>
      <nav>
        <a href="{{ site.baseurl | default: '/C-Programming' }}/">Home</a>
      </nav>
    </header>

    <div class="main">
      <aside class="qb-index">
        {% assign qb = site.pages | where: "path", "question-bank.md" | first %}
        {% if qb %}
          {{ qb.content | markdownify }}
        {% else %}
          <p><em>Question index not found. Ensure <code>question-bank.md</code> exists at repository root.</em></p>
        {% endif %}
      </aside>

      <main class="content">
        {{ content }}
      </main>
    </div>
  </div>
</body>
</html>
